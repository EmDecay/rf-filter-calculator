[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-filter-calculator"
version = "2.0.0"
description = "Command-line tool for calculating LC filter component values for RF engineers and amateur radio operators"
readme = "README.md"
license = {text = "GPL-3.0"}
authors = [
    {name = "Matt N3AR"}
]
keywords = ["rf", "filter", "calculator", "lowpass", "highpass", "bandpass", "electronics", "ham-radio", "butterworth", "chebyshev", "bessel", "lc-filter", "coupled-resonator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (Eda)",
    "Topic :: Communications :: Ham Radio",
]
requires-python = ">=3.10"
dependencies = [
    "textual>=0.89.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.8",
]

[project.scripts]
filter-calc = "filter_lib.cli:main"

[project.urls]
Homepage = "https://github.com/EmDecay/rf-filter-calculator"
Repository = "https://github.com/EmDecay/rf-filter-calculator"
Issues = "https://github.com/EmDecay/rf-filter-calculator/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["filter_lib*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (undefined names, unused imports)
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modernize syntax for 3.10+)
    "B",    # flake8-bugbear (likely bugs)
]
ignore = [
    "E501",  # line too long (formatter handles this)
    "B905",  # zip() without strict= (safe in this codebase — matched-length arrays)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
