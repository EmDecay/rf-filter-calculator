name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-suffix: quality

      - name: Install dependencies
        run: uv sync --locked --group dev --extra web

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

  # CI tests the oldest and newest supported Python, not every version in between. The
  # supported range and the rule for moving it are in docs/code-standards.md
  # ("Supported Python versions"); tests/test_packaging.py keeps these versions, the
  # classifiers, and requires-python in agreement.
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.role }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            role: oldest supported
            coverage: false
          - python-version: "3.14"
            role: newest supported, with coverage
            coverage: true

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}

      - name: Install dependencies (with the web extra)
        run: uv sync --locked --group dev --extra web

      - name: Run the full suite
        if: ${{ !matrix.coverage }}
        run: uv run --locked pytest tests/

      - name: Check runtimes without coverage overhead
        if: ${{ matrix.coverage }}
        run: uv run --locked pytest tests/ -m runtime_budget

      - name: Run correctness suite with coverage
        if: ${{ matrix.coverage }}
        run: >-
          uv run --locked pytest tests/
          -m "not runtime_budget"
          --cov=filter_lib
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90

  # The wheel smoke test installs the wheel without the web extra, so it also covers the
  # core install: the CLI and wizard work, and `filter-calc web` prints the install hint.
  package:
    name: Build and smoke distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality, test]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-suffix: package

      - name: Install test dependencies
        run: uv sync --locked --group dev

      - name: Build wheel and source distribution
        run: uv build

      - name: Verify distribution archives
        env:
          RF_FILTER_DIST_DIR: ${{ github.workspace }}/dist
        run: uv run --locked pytest tests/test_packaging.py

      - name: Smoke installed wheel
        run: python tests/wheel_smoke.py dist/*.whl

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rf-filter-calculator-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
