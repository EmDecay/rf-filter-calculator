name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: quality

      - name: Install dependencies
        run: uv sync --locked --group dev --extra web

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}

      - name: Install dependencies (with the web extra)
        run: uv sync --locked --group dev --extra web

      - name: Check runtimes without coverage overhead
        run: uv run --locked pytest tests/ -m runtime_budget

      - name: Run correctness suite with coverage
        run: >-
          uv run --locked pytest tests/
          -m "not runtime_budget"
          --cov=filter_lib
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90

  core-install:
    name: Core install without the web extra
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: core

      - name: Install dependencies (no extras)
        run: uv sync --locked --group dev

      - name: Run the suite; web tests skip themselves
        run: uv run --locked pytest tests/ -m "not runtime_budget" -q

      - name: filter-calc web explains how to install the extra
        run: |
          set +e
          message=$(uv run --locked filter-calc web 2>&1)
          status=$?
          set -e
          echo "$message"
          test "$status" -eq 1
          test "$message" = "Error: The web UI needs the optional web dependencies; install with: uv sync --extra web"

  package:
    name: Build and smoke distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality, test, core-install]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: package

      - name: Install test dependencies
        run: uv sync --locked --group dev

      - name: Build wheel and source distribution
        run: uv build

      - name: Verify distribution archives
        env:
          RF_FILTER_DIST_DIR: ${{ github.workspace }}/dist
        run: uv run --locked pytest tests/test_packaging.py

      - name: Smoke installed wheel
        run: python tests/wheel_smoke.py dist/*.whl

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: rf-filter-calculator-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
